<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply for {{ job.title }}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 650px;
        margin: 40px auto;
        padding: 20px;
        background: #f5f7fb;
        color: #222;
      }

      .card {
        background: white;
        padding: 28px;
        border-radius: 10px;
        box-shadow: 0 2px 12px #00000012;
      }

      input,
      button {
        margin-top: 12px;
      }

      input[type="file"] {
        display: block;
        width: 100%;
        padding: 12px 0;
      }

      button {
        background: #2457d6;
        color: white;
        padding: 12px 18px;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }

      .error {
        color: #b42318;
        background: #fef3f2;
        padding: 10px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Apply for Job</h1>

      <h2>{{ job.title }}</h2>
      <p>{{ job.company_name }} — {{ job.location }}</p>

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="resume"> Upload your resume (PDF, maximum 5 MB) </label>

        <input
          type="file"
          id="resume"
          name="resume"
          accept=".pdf,application/pdf"
          required
        />

        <button type="submit">Submit Application</button>
      </form>

      <p>
        <a href="{% url 'job-detail' job.pk %}">Back to job details</a>
      </p>
    </div>
  </body>
</html>
